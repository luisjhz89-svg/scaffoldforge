<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PayPal Checkout — {{appName}}</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 34rem; padding: 0 1rem; color: #172033; }
      main { border: 1px solid #d9deea; border-radius: 1rem; padding: 2rem; }
      #status { min-height: 1.5rem; }
    </style>
    <script src="/checkout.js" defer></script>
  </head>
  <body>
    <main>
      <h1>{{appName}} checkout</h1>
      <p>PayPal Checkout demo. Update the server-side amount and currency in your environment configuration.</p>
      <div id="paypal-button-container"></div>
      <p id="status" role="status" aria-live="polite">Loading PayPal…</p>
    </main>
  </body>
</html>
